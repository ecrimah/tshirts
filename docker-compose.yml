services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mamator
      POSTGRES_USER: mamator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - mamator_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamator -d mamator"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://mamator:${POSTGRES_PASSWORD:-changeme}@db:5432/mamator
      NEXT_PUBLIC_APP_URL: https://mamator.com
      UPLOAD_DIR: /var/www/mamator/uploads
    volumes:
      - mamator_uploads:/var/www/mamator/uploads
    ports:
      - "3005:3005"

volumes:
  mamator_pg:
  mamator_uploads:
