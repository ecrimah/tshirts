server {
    listen 80;
    listen [::]:80;
    server_name www.mamator.com;
    return 301 https://mamator.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mamator.com;

    # After certbot, this block is usually redirected to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mamator.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mamator.com;

    # ssl_certificate /etc/letsencrypt/live/mamator.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mamator.com/privkey.pem;

    client_max_body_size 25m;

    location /uploads/ {
        alias /var/www/mamator/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
